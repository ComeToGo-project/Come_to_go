<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>관리자 페이지</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white min-h-screen flex flex-col">

<script>
    let pendingForm = null;
    let pendingAction = "";

    document.addEventListener("DOMContentLoaded", function () {
        document.querySelectorAll('.confirm-form button').forEach(btn => {
            btn.addEventListener('click', function (e) {
                e.preventDefault(); // 기본 동작 중단 (폼 자동 전송 방지)
                pendingForm = btn.closest("form");
                pendingAction = btn.getAttribute("data-action");
                document.getElementById('modalMessage').textContent =
                    `정말 ${pendingAction} 하시겠습니까?`;
                if (pendingAction === '정지') {
                    document.getElementById('banDaysInput').classList.remove("hidden");
                } else {
                    document.getElementById('banDaysInput').classList.add("hidden");
                }
                document.getElementById('confirmModal').classList.remove("hidden");
            });
        });

        document.getElementById('modalYes').addEventListener('click', function () {
            if (pendingForm) {
                if (pendingAction === '정지') {
                    const banDays = document.getElementById('banDays').value;
                    let hiddenInput = document.createElement('input');
                    hiddenInput.type = 'hidden';
                    hiddenInput.name = 'banDays';
                    hiddenInput.value = banDays;
                    pendingForm.appendChild(hiddenInput);
                }
                pendingForm.submit();
            }
            document.getElementById('confirmModal').classList.add("hidden");
            pendingForm = null;
        });

        document.getElementById('modalNo').addEventListener('click', function () {
            document.getElementById('confirmModal').classList.add("hidden");
            pendingForm = null;
        });
    });
</script>

<div class="w-full relative flex items-center pt-10 h-20">
    <div class="absolute left-10 top-1/2 -translate-y-1/2">
        <a href="/">
            <img src="/img/ctg-image.png" alt="로고" class="h-10"/>
        </a>
    </div>
    <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2">
        <a href="/admin/management">
      <span class="w-1/2 font-bold text-2xl border-8 border-blue-700 px-6 py-3 bg-white text-gray-900 text-center">
        관리자 페이지
      </span>
        </a>
    </div>
</div>

<div class="bg-blue-600 p-8 rounded w-[900px] mx-auto mt-8">
    <div class="flex items-center mb-5">
        <span class="bg-white font-bold text-xl rounded px-5 py-2 mr-6 shadow">사용자 관리</span>
    </div>

    <!-- 필터/검색 영역 -->
    <form class="flex items-center space-x-4 mb-3" th:action="@{/admin/management/user}" method="get">
        <select name="filterType" class="rounded bg-violet-300 text-white font-bold px-3 py-2">
            <option value="nickname">닉네임</option>
            <option value="email">이메일</option>
        </select>
        <input type="text" name="keyword" placeholder="검색창"
               class="rounded bg-violet-300 px-5 py-2 w-[320px] focus:outline-none">
        <button type="submit" class="bg-violet-400 text-white rounded px-4 py-2 font-bold">검색</button>
        <select name="userStatus" class="rounded bg-white text-blue-600 font-bold px-2 py-2 ml-6">
            <option value="">전체</option>
            <option value="ACTIVE">정상</option>
            <option value="SUSPENDED">정지</option>
        </select>
    </form>

    <!-- 사용자 목록 영역 -->
    <div>
        <span class="bg-white font-bold px-4 py-2 rounded mb-2 inline-block shadow">사용자 목록</span>
        <table class="mt-2 min-w-full bg-white rounded text-center">
            <thead>
            <tr class="border-b">
                <th class="py-2">닉네임</th>
                <th class="py-2">이메일</th>
                <th class="py-2">가입일</th>
                <th class="py-2">권한</th>
                <th class="py-2">상태</th>
                <th class="py-2">관리</th>
            </tr>
            </thead>
            <tbody>
            <tr class="border-b" th:each="user : ${userList}">
                <td th:text="${user.nickname}" class="py-2"></td>
                <td th:text="${user.email}" class="py-2"></td>
                <td th:text="${user.joinDate}" class="py-2"></td>
                <td class="py-2">
                    <span th:if="${user.userRole == 'USER'}">회원</span>
                    <span th:if="${user.userRole == 'ADMIN'}">관리자</span>
                </td>
                <td class="py-2">
                    <span th:if="${user.userStatus == 'ACTIVE'}">정상</span>
                    <span th:if="${user.userStatus == 'SUSPENDED'}">
                        정지
                        <span th:if="${user.banDaysLeft != null}">
                            (<span th:text="${user.banDaysLeft}"/>일 남음)
                        </span>
                    </span>
                </td>
                <td class="py-2 space-x-2">
                    <form th:action="@{'/admin/management/user/' + ${user.userId} + '/suspend'}"
                          th:if="${user.userStatus == 'ACTIVE'}" method="post" class="inline-block confirm-form">
                        <button type="button" class="text-red-600 font-bold" data-action="정지">[정지]</button>
                    </form>
                    <form th:action="@{'/admin/management/user/' + ${user.userId} + '/unsuspend'}"
                          th:if="${user.userStatus == 'SUSPENDED'}" method="post" class="inline-block confirm-form">
                        <button type="button" class="text-green-600 font-bold" data-action="정지 해제">[정지 해제]</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- 모달 팝업 -->
<div id="confirmModal" class="fixed inset-0 flex items-center justify-center z-50 hidden bg-black bg-opacity-50">
    <div class="bg-white p-8 rounded shadow-md text-center w-80">
        <div class="mb-6 text-lg font-semibold" id="modalMessage">
            정말 실행하시겠습니까?
        </div>
        <div id="banDaysInput" class="mb-4 hidden">
            <input type="number" id="banDays" min="1" placeholder="정지 기간(일)" class="border rounded px-4 py-2 w-full"/>
        </div>
        <div class="flex justify-center gap-8">
            <button id="modalYes" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">예</button>
            <button id="modalNo" class="bg-gray-300 px-6 py-2 rounded hover:bg-gray-400">아니오</button>
        </div>
    </div>
</div>

</body>
</html>
