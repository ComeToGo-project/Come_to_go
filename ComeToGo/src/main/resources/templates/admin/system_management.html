<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>관리자 페이지</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white min-h-screen flex flex-col">
<div class="w-full relative flex items-center pt-10 h-20">
    <div class="absolute left-10 top-1/2 -translate-y-1/2">
        <a href="/">
            <img src="/img/자산%204.png" alt="로고" class="h-10"/>
        </a>
    </div>
    <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2">
        <a href="/admin/management">
      <span class="w-1/2 font-bold text-2xl border-8 border-blue-700 px-6 py-3 bg-white text-gray-900 text-center">
        관리자 페이지
      </span>
        </a>
    </div>
</div>

<div class="bg-blue-600 p-8 rounded w-[900px] mx-auto mt-8">
    <div class="flex items-center mb-5">
        <span class="bg-white font-bold text-xl rounded px-5 py-2 mr-6 shadow">시스템 관리</span>
    </div>

    <div class="mb-8">
        <span class="bg-white font-bold px-4 py-2 rounded mb-2 inline-block shadow">동호회 카테고리 목록</span>
        <form th:action="@{/admin/management/system/group-category/add}" method="post" class="flex gap-2 mt-2">
            <input type="text" name="categoryName" placeholder="카테고리명 입력" class="px-3 py-2 rounded w-48">
            <button type="submit" class="bg-green-500 text-white px-3 py-2 rounded font-bold hover:bg-green-600">+ 추가</button>
        </form>
        <div class="flex gap-4 mt-4">
            <div th:each="cat : ${categories}" class="bg-white rounded px-4 py-2 flex items-center gap-2 shadow">
                <span th:text="${cat.categoryName}" class="font-semibold"></span>
                <form th:action="@{/admin/management/system/group-category/delete}" method="post" style="display:inline;">
                    <input type="hidden" name="categoryId" th:value="${cat.categoryId}">
                    <button type="submit" class="bg-red-500 text-white rounded px-2 py-1 font-bold hover:bg-red-600">- 삭제</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
