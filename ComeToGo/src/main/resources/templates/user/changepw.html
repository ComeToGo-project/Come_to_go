<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>비밀번호 변경</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

<div class="bg-white rounded-lg shadow-md p-8 w-full max-w-md">
    <h1 class="text-2xl font-bold text-center mb-6">비밀번호 변경</h1>

    <form th:action="@{/user/mypage/change-password}" method="post" class="space-y-4">
        <div>
            <label for="currentPw" class="block font-semibold mb-1">현재 비밀번호</label>
            <input type="password" id="currentPw" name="currentPw" placeholder="현재 비밀번호 입력"
                   class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" required />
        </div>

        <div>
            <label for="newPw" class="block font-semibold mb-1">새 비밀번호</label>
            <input type="password" id="newPw" name="newPw" placeholder="새 비밀번호 입력"
                   class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" required />
        </div>

        <div>
            <label for="newPwConfirm" class="block font-semibold mb-1">새 비밀번호 확인</label>
            <input type="password" id="newPwConfirm" name="newPwConfirm" placeholder="새 비밀번호 확인"
                   class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" required />
        </div>
        <div th:if="${error}" class="text-red-500 text-sm mb-2" th:text="${error}"></div>
        <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded font-semibold hover:bg-blue-700 transition">
            비밀번호 변경
        </button>
    </form>
</div>
</body>
</html>
