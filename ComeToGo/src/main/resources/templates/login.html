<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

<form action="/user/login" method="post" class="bg-white rounded-lg shadow-md p-8 w-full max-w-md space-y-4">

    <h1 class="text-2xl font-bold text-center mb-4">로그인</h1>

    <!-- 아이디 -->
    <div>
        <label class="block font-semibold mb-1">아이디</label>
        <input type="text" name="id" placeholder="아이디" required
               class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"/>
    </div>

    <!-- 비밀번호 -->
    <div>
        <label class="block font-semibold mb-1">비밀번호</label>
        <input type="password" name="pw" placeholder="비밀번호" required
               class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"/>
    </div>

    <!-- 로그인 버튼 -->
    <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition">
        로그인
    </button>
    <p th:if="${loginError != null}" th:text="${loginError}" style="color:red;"></p>

    <!-- 회원가입 버튼 -->
    <a href="/user/join" class="block text-center w-full bg-gray-200 text-gray-700 py-2 rounded hover:bg-gray-300 transition">
        회원가입
    </a>

    <!-- 아이디/비밀번호 찾기 -->
    <div class="flex gap-2">
        <a href="/user/find-id" class="flex-1 text-center bg-gray-100 text-gray-700 py-2 rounded hover:bg-gray-200 transition">
            아이디 찾기
        </a>
        <a href="/user/find-password" class="flex-1 text-center bg-gray-100 text-gray-700 py-2 rounded hover:bg-gray-200 transition">
            비밀번호 찾기
        </a>
    </div>
</form>
<script th:inline="javascript">
    /*<![CDATA[*/
    var msg = /*[[${joinSuccessMsg}]]*/ null;
    if(msg) alert(msg);
    /*]]>*/
</script>
</body>
</html>
