<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

<form th:action="@{/user/join}" th:object="${userDto}" method="post"
      class="bg-white rounded-lg shadow-md p-8 w-full max-w-md space-y-4">

    <h1 class="text-2xl font-bold text-center mb-4">회원가입</h1>

    <!-- 아이디 -->
    <div>
        <label class="block font-semibold mb-1">아이디</label>
        <input type="text" th:field="*{id}" placeholder="아이디"
               class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        <p th:if="${#fields.hasErrors('id')}" th:errors="*{id}" class="text-xs text-red-500 mt-1"></p>
        <p th:if="${idDuplicateError != null}" th:text="${idDuplicateError}" class="text-xs text-red-500 mt-1"></p>
    </div>

    <!-- 비밀번호 -->
    <div>
        <label class="block font-semibold mb-1">비밀번호</label>
        <input type="password" th:field="*{pw}" placeholder="비밀번호"
               class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        <p th:if="${#fields.hasErrors('pw')}" th:errors="*{pw}" class="text-xs text-red-500 mt-1"></p>
    </div>

    <!-- 비밀번호 확인 -->
    <div>
        <label class="block font-semibold mb-1">비밀번호 확인</label>
        <input type="password" th:field="*{pwCheck}" placeholder="비밀번호 확인"
               class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        <p th:if="${#fields.hasErrors('pwCheck')}" th:errors="*{pwCheck}" class="text-xs text-red-500 mt-1"></p>
    </div>
    <!-- 비밀번호 불일치 에러 메시지 표시 -->
    <div th:if="${pwError != null}" th:text="${pwError}" class="text-xs text-red-500 mt-1"></div>
    <!-- 이름 -->
    <div>
        <label class="block font-semibold mb-1">이름</label>
        <input type="text" th:field="*{user_name}" placeholder="이름"
               class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        <p th:if="${#fields.hasErrors('user_name')}" th:errors="*{user_name}" class="text-xs text-red-500 mt-1"></p>
    </div>

    <!-- 닉네임 -->
    <div>
        <label class="block font-semibold mb-1">닉네임</label>
        <input type="text" th:field="*{nickname}" placeholder="닉네임"
               class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        <p th:if="${#fields.hasErrors('nickname')}" th:errors="*{nickname}" class="text-xs text-red-500 mt-1"></p>
    </div>
    <p th:if="${nicknameDuplicateError != null}" th:text="${nicknameDuplicateError}"
       class="text-xs text-red-500 mt-1"></p>

    <!-- 성별 -->
    <div>
        <label class="block font-semibold mb-1">성별</label>
        <select th:field="*{gender}" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="" disabled selected>선택</option>
            <option value="M">남자</option>
            <option value="F">여자</option>
        </select>
        <p th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}" class="text-xs text-red-500 mt-1"></p>
    </div>

    <!-- 생년월일 -->
    <div>
        <label class="block font-semibold mb-1">생년월일</label>
        <input type="date" th:field="*{birth}"
               class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        <p th:if="${#fields.hasErrors('birth')}" th:errors="*{birth}" class="text-xs text-red-500 mt-1"></p>
    </div>

    <!-- 전화번호 -->
    <div>
        <label class="block font-semibold mb-1">전화번호</label>
        <input type="text" id="phone" th:field="*{phone}" placeholder="010-1234-5678"
               class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        <p th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="text-xs text-red-500 mt-1"></p>
    </div>

    <!-- 이메일 + 인증 버튼 -->
    <div>
        <label class="block font-semibold mb-1">이메일</label>
        <div class="flex gap-2">
            <input type="email" th:field="*{email}" placeholder="example@domain.com"
                   class="flex-1 border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"/>
            <button type="button" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">
                인증 요청
            </button>
        </div>
        <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-xs text-red-500 mt-1"></p>
        <p th:if="${emailDuplicateError != null}" th:text="${emailDuplicateError}"
           class="text-xs text-red-500 mt-1"></p>
    </div>

    <!-- 주소 -->
    <div>
        <label class="block font-semibold mb-1">주소</label>
        <button type="button"
                onclick="execDaumPostcode()"
                class="w-full bg-gray-200 text-gray-700 py-2 rounded mb-2 hover:bg-gray-300">
            주소 검색
        </button>
        <input type="text" th:field="*{address.city}" id="city" placeholder="시/도"
               class="w-full border border-gray-300 rounded px-3 py-2 mt-1" readonly />
        <p th:if="${#fields.hasErrors('address.city')}" th:errors="*{address.city}" class="text-xs text-red-500 mt-1"></p>
        <input type="text" th:field="*{address.district}" id="district" placeholder="구/군"
               class="w-full border border-gray-300 rounded px-3 py-2 mt-1" readonly />
        <p th:if="${#fields.hasErrors('address.district')}" th:errors="*{address.district}" class="text-xs text-red-500 mt-1"></p>
        <input type="text" th:field="*{address.neighborhood}" id="neighborhood" placeholder="동/읍/면"
               class="w-full border border-gray-300 rounded px-3 py-2 mt-1" readonly />
        <p th:if="${#fields.hasErrors('address.neighborhood')}" th:errors="*{address.neighborhood}" class="text-xs text-red-500 mt-1"></p>
    </div>

    <!-- 회원가입 버튼 -->
    <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition">
        회원가입
    </button>

</form>
<!--주소 JS-->
<script>
    function execDaumPostcode() {
        new daum.Postcode({
            oncomplete: function(data) {
                document.getElementById("city").value = data.sido;
                document.getElementById("district").value = data.sigungu;
                document.getElementById("neighborhood").value = data.bname ? data.bname : "";
            }
        }).open();
    }
</script>
<!--전화번호 형식 JS-->
<script>
    const phoneInput = document.getElementById('phone');

    phoneInput.addEventListener('input', function(e) {
        let number = this.value.replace(/[^0-9]/g, '');
        if (number.length < 4) {
            this.value = number;
        } else if (number.length < 7) {
            this.value = number.substr(0,3) + '-' + number.substr(3);
        } else if (number.length <= 11) {
            this.value = number.substr(0,3) + '-' + number.substr(3,4) + '-' + number.substr(7);
        } else {
            this.value = number.substr(0,3) + '-' + number.substr(3,4) + '-' + number.substr(7,4);
        }
    });
</script>
</body>
</html>
