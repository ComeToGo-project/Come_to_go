<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title th:text="|${groupDetail.groupName} - 오며가며|">동호회 상세</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

<!-- 헤더 -->
<div th:replace="fragments :: header"></div>

<!-- 성공/에러 메시지 -->
<div th:if="${successMessage}"
     class="success-message mb-4 p-4 bg-green-100 text-green-700 rounded-xl text-center shadow">
  <p th:text="${successMessage}"></p>
</div>
<div th:if="${errorMessage}"
     class="error-message mb-4 p-4 bg-red-100 text-red-700 rounded-xl text-center shadow">
  <p th:text="${errorMessage}"></p>
</div>

<main class="max-w-6xl mx-auto px-6 py-10 grid grid-cols-1 md:grid-cols-3 gap-8">

  <!-- 왼쪽 영역 -->
  <section class="md:col-span-1 flex flex-col gap-6">

    <!-- 동호회 정보 -->
    <div class="bg-white p-6 rounded-2xl shadow text-center">
      <h2 class="text-2xl font-bold text-gray-800" th:text="${groupDetail.groupName}">동호회 이름</h2>
      <p class="text-gray-600"
         th:text="'카테고리: ' + (${groupDetail.categoryName} ?: '카테고리 없음')"></p>

      <div class="flex justify-center gap-6 mt-3">
        <div>
          <p class="text-gray-500 text-sm">멤버 수</p>
          <p class="text-xl font-semibold text-indigo-600" th:text="${groupDetail.memberCount}">0</p>
        </div>
        <div>
          <p class="text-gray-500 text-sm">게시글 수</p>
          <p class="text-xl font-semibold text-indigo-600" th:text="${groupDetail.postCount}">0</p>
        </div>
      </div>
    </div>

    <!-- 오너일 때: 가입 신청 관리 버튼 -->
    <div th:if="${groupDetail.isOwner}">
    <a th:href="@{/groups/{groupId}/register-requests(groupId=${groupDetail.groupId})}"
         class="w-full block bg-gray-800 text-white py-2 rounded-xl text-center hover:bg-gray-900 transition">
        가입 신청 관리
      </a>
      <a th:href="@{/groups/{groupId}/manage(groupId=${groupDetail.groupId})}"
         class="w-full block mt-2 bg-gray-700 text-white py-2 rounded-xl text-center hover:bg-gray-800 transition">
        동호회 관리 페이지
      </a>
    </div>

    <!-- 회원이지만 오너는 아님 -->
    <div th:if="${groupDetail.isMember and !groupDetail.isOwner}">
      <form th:action="@{/groups/{groupId}/leave(groupId=${groupDetail.groupId})}" method="post">
        <button type="submit"
                class="w-full bg-red-100 text-red-600 py-2 rounded-xl hover:bg-red-200 transition">
          탈퇴
        </button>
      </form>
    </div>

    <!-- 비회원 -->
    <div th:if="${!groupDetail.isMember and !groupDetail.isOwner}">
      <a th:href="@{/groups/{groupId}/register(groupId=${groupDetail.groupId})}"
         class="w-full block bg-indigo-600 text-white py-2 rounded-xl text-center hover:bg-indigo-700 transition">
        가입 신청
      </a>
    </div>


  </section>

  <!-- 오른쪽 영역 -->
  <section class="md:col-span-2 flex flex-col gap-6">

    <!-- 동호회 소개 -->
    <div class="bg-white p-6 rounded-2xl shadow">
      <h3 class="text-xl font-semibold mb-4 text-gray-800">동호회 소개</h3>
      <p class="text-gray-700 whitespace-pre-line" th:text="${groupDetail.intro}">
        이곳은 동호회 소개가 표시되는 영역입니다.
      </p>
    </div>

    <!-- 앨범 -->
    <div class="bg-white p-6 rounded-2xl shadow">
      <div class="flex justify-between items-center mb-3">
        <h3 class="text-xl font-semibold text-gray-800">앨범</h3>
        <a th:href="@{/groups/{groupId}/album(groupId=${groupDetail.groupId})}"
           class="text-indigo-500 text-sm hover:underline">더보기</a>
      </div>
      <p class="text-gray-500 text-sm">사진 미리보기 영역 (예시)</p>
    </div>

    <!-- 멤버 정보 -->
    <div class="bg-white p-6 rounded-2xl shadow">
      <div class="flex justify-between items-center mb-3">
        <h3 class="text-xl font-semibold text-gray-800">멤버 정보</h3>
        <a th:href="@{/groups/{groupId}/members(groupId=${groupDetail.groupId})}"
           class="text-indigo-500 text-sm hover:underline">더보기</a>
      </div>
      <ul class="grid grid-cols-2 sm:grid-cols-3 gap-3">
        <li th:each="member : ${groupDetail.members}" class="p-3 bg-gray-100 rounded-xl text-center">
          <p class="font-medium text-gray-800" th:text="${member.nickname}">홍길동</p>
          <p class="text-sm text-gray-500" th:text="${member.role}">OWNER</p>
        </li>
      </ul>
    </div>

    <!-- 일정 -->
    <div class="bg-white p-6 rounded-2xl shadow">
      <div class="flex justify-between items-center mb-3">
        <h3 class="text-xl font-semibold text-gray-800">일정</h3>
        <a th:href="@{/groups/{groupId}/schedule(groupId=${groupDetail.groupId})}"
           class="text-indigo-500 text-sm hover:underline">더보기</a>
      </div>
      <p class="text-gray-500 text-sm">다가오는 일정 요약...</p>
    </div>

    <!-- 게시글 -->
    <div class="bg-white p-6 rounded-2xl shadow">
      <div class="flex justify-between items-center mb-3">
        <h3 class="text-xl font-semibold text-gray-800">게시글</h3>
        <a th:href="@{/groups/{groupId}/posts(groupId=${groupDetail.groupId})}"
           class="text-indigo-500 text-sm hover:underline">더보기</a>
      </div>
      <div th:if="${#lists.isEmpty(groupDetail.posts)}" class="text-gray-500 text-sm">
        아직 게시글이 없습니다.
      </div>
      <ul th:if="${!#lists.isEmpty(groupDetail.posts)}" class="space-y-3">
        <li th:each="post : ${groupDetail.posts}"
            class="p-4 border border-gray-200 rounded-xl hover:bg-gray-50">
          <a th:href="@{'/posts/' + ${post.postId}}"
             class="text-indigo-600 font-medium hover:underline"
             th:text="${post.title}">게시글 제목</a>
          <p class="text-sm text-gray-500 mt-1" th:text="${post.summary}">게시글 요약...</p>
        </li>
      </ul>
    </div>

  </section>
</main>

<script>
  // 3초 후 성공/에러 메시지 사라짐
  setTimeout(() => {
    const msg = document.querySelector('.success-message, .error-message');
    if(msg) msg.style.display = 'none';
  }, 3000);
</script>

<div th:replace="fragments :: footer"></div>
</body>
</html>
