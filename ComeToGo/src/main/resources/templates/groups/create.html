<!DOCTYPE html>
<html lang="ko" class="scroll-smooth" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>동호회 생성 - 오며가며</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 min-h-screen flex flex-col">
<div th:replace="fragments :: header"></div>

<main class="flex-grow container mx-auto px-4 sm:px-6 md:px-8 py-8 max-w-4xl">
  <h1 class="text-3xl font-bold text-gray-800 mb-8">동호회 생성</h1>

  <form id="createGroupForm" th:action="@{/groups/create}" th:object="${groupDto}" method="post" class="bg-white p-8 rounded shadow-sm space-y-6">

    <!-- 동호회명 -->
    <div class="flex flex-col sm:flex-row sm:space-x-4 items-start sm:items-center">
      <label for="groupName" class="w-full sm:w-32 text-gray-700 font-semibold mb-2 sm:mb-0">동호회명<span class="text-red-500">*</span></label>
      <div class="flex-grow">
        <input type="text" id="groupName" th:field="*{groupName}" placeholder="동호회명을 입력하세요"
               class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" required />
      </div>
      <button type="button" class="mt-3 sm:mt-0 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded font-semibold">중복체크</button>
    </div>

    <!-- 카테고리 -->
    <div class="flex flex-col sm:flex-row sm:space-x-4 items-center">
      <label for="categoryId" class="w-full sm:w-32 text-gray-700 font-semibold mb-2 sm:mb-0">카테고리<span class="text-red-500">*</span></label>
      <div class="flex-grow">
        <select id="categoryId" th:field="*{categoryId}"
                class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" required>
          <option value="" disabled selected>선택해주세요</option>
          <option value="1">운동</option>
          <option value="2">문화/책</option>
          <option value="3">여행</option>
          <option value="4">음악</option>
        </select>
      </div>
    </div>

    <!-- 지도 팝업 열기 -->
    <div>
      <label class="text-gray-700 font-semibold mb-2 block">지도에서 위치 선택</label>
      <!-- ✅ location.href → openMapPopup() 으로 변경 -->
      <button type="button" onclick="openMapPopup()"
              class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded">
        지도 열기
      </button>
      <p class="text-sm text-gray-600 mt-2">
        지도에서 클릭한 위치가 아래 입력란에 자동으로 채워집니다.
      </p>
    </div>



    <!-- 지역 입력 -->
    <div class="mt-4">
      <label for="city" class="block text-gray-700 font-semibold mb-1">도시</label>
      <input type="text" id="city" th:field="*{city}" placeholder="예: 서울"
             class="w-full border border-gray-300 rounded px-3 py-2" readonly />
    </div>

    <div>
      <label for="district" class="block text-gray-700 font-semibold mb-1">구/군</label>
      <input type="text" id="district" th:field="*{district}" placeholder="예: 강남구"
             class="w-full border border-gray-300 rounded px-3 py-2" readonly />
    </div>

    <div>
      <label for="neighborhood" class="block text-gray-700 font-semibold mb-1">동/읍/면</label>
      <input type="text" id="neighborhood" th:field="*{neighborhood}" placeholder="예: 역삼동"
             class="w-full border border-gray-300 rounded px-3 py-2" readonly />
    </div>

    <!-- 소개 내용 -->
    <div class="mt-4">
      <label for="intro" class="block text-gray-700 font-semibold mb-1">소개 내용</label>
      <textarea id="intro" th:field="*{intro}" rows="5" placeholder="간단한 소개를 입력하세요"
                class="w-full border border-gray-300 rounded p-3 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
    </div>

    <!-- 가입 메시지 -->
    <div>
      <label for="joinMessage" class="block text-gray-700 font-semibold mb-1">가입 메시지</label>
      <input type="text" id="joinMessage" th:field="*{joinMessage}" placeholder="가입시 보여질 메시지 입력"
             class="w-full border border-gray-300 rounded px-3 py-2" />
    </div>

    <!-- 버튼 -->
    <div class="flex space-x-4 justify-end pt-4 border-t border-gray-200">
      <button type="submit"
              class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-2 rounded transition">동호회 생성</button>
      <button type="button"
              class="bg-gray-300 hover:bg-gray-400 text-gray-700 font-semibold px-6 py-2 rounded transition">취소</button>
    </div>
  </form>
</main>

<div th:replace="fragments :: footer"></div>

<script>
  // ✅ 팝업으로 띄우기
  function openMapPopup() {
    const popup = window.open('/groups/map', 'mapPopup', 'width=600,height=500,scrollbars=yes');
  }

  // ✅ 팝업에서 주소 받아서 채우기
  function setAddress(city, district, neighborhood) {
    document.getElementById('city').value = city;
    document.getElementById('district').value = district;
    document.getElementById('neighborhood').value = neighborhood;
  }
</script>

</body>
</html>
