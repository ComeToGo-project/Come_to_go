<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아이디 찾기</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
<div class="min-h-screen flex items-center justify-center py-12 px-4">
    <div class="max-w-md w-full bg-white rounded-lg shadow-md p-8">
        <h2 class="text-2xl font-bold text-center mb-6">아이디 찾기</h2>

        <!-- 결과 표시 영역 -->
        <div id="resultArea" class="hidden mb-4 p-4 rounded"></div>

        <!-- 입력 폼 -->
        <div id="inputForm">
            <p class="text-sm text-gray-600 mb-4">가입 시 입력한 이름과 이메일을 입력해주세요.</p>

            <div class="space-y-4">
                <div>
                    <label class="block font-semibold mb-1">이름</label>
                    <input type="text" id="userName" placeholder="이름 입력"
                           class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"/>
                </div>

                <div>
                    <label class="block font-semibold mb-1">이메일</label>
                    <input type="email" id="userEmail" placeholder="이메일 입력"
                           class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"/>
                </div>

                <button onclick="findId()" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition">
                    아이디 찾기
                </button>
            </div>
        </div>

        <div class="mt-4 text-center text-sm">
            <a href="/user/login" class="text-blue-600 hover:underline">로그인으로 돌아가기</a>
            <span class="mx-2">|</span>
            <a href="/user/login/find-password" class="text-blue-600 hover:underline">비밀번호 찾기</a>
        </div>
    </div>
</div>

<script>
    function findId() {
        const userName = document.getElementById('userName').value;
        const userEmail = document.getElementById('userEmail').value;
        const resultArea = document.getElementById('resultArea');

        if (!userName || !userEmail) {
            alert('이름과 이메일을 입력해주세요.');
            return;
        }

        fetch('/user/find-id', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
            },
            body: 'userName=' + encodeURIComponent(userName) + '&email=' + encodeURIComponent(userEmail)
        })
            .then(response => response.json())
            .then(function(data) {
                if (data.success) {
                    resultArea.className = 'mb-4 p-4 rounded bg-green-50 border border-green-300';
                    resultArea.innerHTML = '<p class="font-semibold text-green-700">아이디를 찾았습니다!</p>' +
                        '<p class="mt-2">회원님의 아이디는 <strong class="text-lg">' + data.userId + '</strong> 입니다.</p>' +
                        '<a href="/user/login" class="inline-block mt-3 text-blue-600 hover:underline">로그인하러 가기</a>';
                    resultArea.classList.remove('hidden');
                    document.getElementById('inputForm').style.display = 'none';
                } else {
                    resultArea.className = 'mb-4 p-4 rounded bg-red-50 border border-red-300';
                    resultArea.innerHTML = '<p class="text-red-700">' + (data.message || '일치하는 회원 정보를 찾을 수 없습니다.') + '</p>';
                    resultArea.classList.remove('hidden');
                }
            })
            .catch(function(error) {
                alert('오류가 발생했습니다.');
            });
    }
</script>
</body>
</html>
